services:
  postgres:
    build:
      context: ./infra/postgres
      dockerfile: Dockerfile
    container_name: nyc-snow-equity-db
    environment:
      POSTGRES_DB: nyc_snow_equity
      POSTGRES_USER: snow_user
      POSTGRES_PASSWORD: snow_pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U snow_user -d nyc_snow_equity"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
